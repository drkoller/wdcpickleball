<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Object Position Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px;
      color: #17201c;
      background: #f5f5ef;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 709px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 20px;
      color: #637069;
    }

    .gallery-card {
      position: relative;
      width: 100%;
      height: 618px;
      overflow: hidden;
      background: #205442;
      border-radius: 20px;
    }

    .gallery-card img {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: cover;
      transform: none;
    }

    .gallery-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 50%,
        rgba(6, 24, 18, 0.72) 100%
      );
    }

    .gallery-card span {
      position: absolute;
      z-index: 2;
      bottom: 18px;
      left: 18px;
      padding: 8px 13px;
      color: #fff;
      background: rgba(11, 41, 33, 0.8);
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Object position preview</h1>
    <p>Featured card at 709 × 618px, normal scale</p>

    <div class="gallery-card">
      <img
        id="preview-image"
        src="images/gallery/IMG_7626.jpeg"
        alt="DCPL members at the 2026 Juneteenth celebration."
      >
      <span>Community</span>
    </div>
  </main>

  <script>
    const positions = {
      center: "center center",
      45: "45% center",
      40: "40% center",
      55: "55% center",
      60: "60% center"
    };

    const key = new URLSearchParams(window.location.search).get("position");
    const position = positions[key] || positions.center;

    document.getElementById("preview-image").style.objectPosition = position;
    document.getElementById("title").textContent =
      `Object position: ${position}`;
  </script>
</body>
</html>
