<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Crop Preview</title>
  <style>
    :root {
      --green-800: #205442;
      --radius-medium: 20px;
      --container-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 48px 0;
      color: #17201c;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(calc(100% - 48px), var(--container-width));
      margin-inline: auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    .instructions {
      margin: 0 0 32px;
      color: #637069;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1.22fr 0.78fr;
      grid-template-rows: repeat(2, 270px);
      gap: 18px;
    }

    .gallery-card {
      position: relative;
      overflow: hidden;
      background: var(--green-800);
      border-radius: var(--radius-medium);
    }

    .gallery-card-large {
      grid-row: 1 / span 2;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 50%,
        rgba(6, 24, 18, 0.72) 100%
      );
    }

    .gallery-card > span {
      position: absolute;
      z-index: 2;
      bottom: 18px;
      left: 18px;
      padding: 8px 13px;
      color: #ffffff;
      background: rgba(11, 41, 33, 0.8);
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
    }

    .placeholder {
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.75);
      background: var(--green-800);
      border-radius: var(--radius-medium);
      font-size: 0.85rem;
    }

    @media (max-width: 650px) {
      .container {
        width: min(calc(100% - 28px), var(--container-width));
      }

      .gallery-grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, 285px);
      }

      .gallery-card-large {
        grid-row: auto;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Featured Gallery Crop Preview</h1>
    <p class="instructions">
      Resize the browser window to preview the current desktop and mobile crops.
    </p>

    <div class="gallery-grid">
      <div class="gallery-card gallery-card-large">
        <img
          src="images/gallery/IMG_7626.jpeg"
          alt="DCPL members at the 2026 Juneteenth celebration."
        >
        <span>Community</span>
      </div>

      <div class="placeholder">Existing gallery card 2</div>
      <div class="placeholder">Existing gallery card 3</div>
    </div>
  </main>
</body>
</html>
